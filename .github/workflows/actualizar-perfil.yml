name: Actualizar perfil de GitHub

on: 
  schedule:
    - cron: "15 6 * * *"
  
  workflow_dispatch: 

  push:
    branches:
      - main
    paths:
      - "config.json"
      - "scripts/**"
      - ".github/workflows/actualizar-perfil.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    name: "Actualizar estadísticas y README"
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar estadísticas
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/actualizar-perfil.py
      
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add -A assets/

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "chore: actualizar estadísticas del perfil"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"