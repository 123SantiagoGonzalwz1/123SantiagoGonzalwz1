    fill: #17232d;
    stroke: #29404d;
  }
  .titulo {
    fill: #39d0a5;
    font: bold 19px monospace;
  }
  .valor {
    fill: #e6edf3;
    font: bold 31px monospace;
  }
  .texto {
    fill: #a7b7c4;
    font: 13px monospace;
  }

  @media (prefers-color-scheme: light) {
